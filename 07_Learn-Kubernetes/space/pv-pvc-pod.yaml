apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-storage
spec:
  capacity:
    storage: 2G
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/pv-data"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-storage
spec:
  volumeName: pv-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1G
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-pod
spec:
  containers:
    - name: storage-container
      image: nginx:kube
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: test-volume
          mountPath: "/data-store"
  volumes:
    - name: test-volume
      persistentVolumeClaim:
        claimName: pvc-storage